<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" role="img" aria-label="Easy Farm">
  <title>Easy Farm</title>
  <defs>
    <linearGradient id="ef-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <radialGradient id="ef-shine" cx="0.3" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ef-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="ef-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#064E3B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="translate(16 16) scale(0.5625)">
  <rect width="512" height="512" rx="120" fill="url(#ef-bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#ef-shine)"/>
  <g filter="url(#ef-shadow)">
    <!-- sprout: the farm growing -->
    <path d="M256 150V104" stroke="#D9F99D" stroke-width="10" stroke-linecap="round"/>
    <path d="M256 124c-22-2-36-16-38-38 22 0 36 14 38 38z" fill="#D9F99D"/>
    <path d="M256 112c4-24 20-38 42-40-1 24-18 38-42 40z" fill="#BEF264"/>
    <!-- horns -->
    <path d="M198 176c-22-16-36-38-34-66 24 10 42 30 52 54z" fill="#FEF3C7"/>
    <path d="M314 176c22-16 36-38 34-66-24 10-42 30-52 54z" fill="#FEF3C7"/>
    <!-- ears -->
    <ellipse cx="146" cy="226" rx="50" ry="25" transform="rotate(-22 146 226)" fill="#FFFFFF"/>
    <ellipse cx="366" cy="226" rx="50" ry="25" transform="rotate(22 366 226)" fill="#FFFFFF"/>
    <ellipse cx="150" cy="226" rx="28" ry="11" transform="rotate(-22 150 226)" fill="#A7F3D0"/>
    <ellipse cx="362" cy="226" rx="28" ry="11" transform="rotate(22 362 226)" fill="#A7F3D0"/>
    <!-- head -->
    <path d="M256 148c66 0 100 42 100 98 0 44-16 76-36 102-12 16-18 32-18 46H210c0-14-6-30-18-46-20-26-36-58-36-102 0-56 34-98 100-98z" fill="url(#ef-head)"/>
    <!-- muzzle -->
    <rect x="182" y="322" width="148" height="100" rx="50" fill="#D1FAE5"/>
    <ellipse cx="228" cy="372" rx="12" ry="15" fill="#0F766E"/>
    <ellipse cx="284" cy="372" rx="12" ry="15" fill="#0F766E"/>
    <!-- eyes -->
    <circle cx="214" cy="262" r="15" fill="#064E3B"/>
    <circle cx="298" cy="262" r="15" fill="#064E3B"/>
    <circle cx="219" cy="257" r="5" fill="#FFFFFF"/>
    <circle cx="303" cy="257" r="5" fill="#FFFFFF"/>
  </g>
  </g>
  <text x="334" y="186" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="-3" fill="#0F172A">Easy<tspan fill="#10B981">Farm</tspan></text>
  <text x="340" y="252" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="10" fill="#64748B">FARM MANAGEMENT</text>
</svg>
